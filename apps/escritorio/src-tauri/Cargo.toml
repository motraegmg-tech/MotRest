[package]
name = "motrest"
version = "1.0.0"
description = "MotRest — la caja del local"
authors = ["MOTRAE"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "motrest_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Solo para la espera creciente entre reintentos de levantar el Hub. Tauri ya
# arrastra tokio, así que declararlo aquí no añade nada al instalador: solo hace
# explícito lo que ya está, con la mínima superficie ("time").
tokio = { version = "1", features = ["time"] }

[profile.release]
# Un instalador más pequeño se descarga y se distribuye mejor en un local con
# internet lento, que es la condición normal de un restaurante.
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
