<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MotRest</title>
    <style>
      :root {
        --negro: #14181a;
        --acento: #f2853a;
        --gris: #8a969c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        background: var(--negro);
        color: #fff;
        font-family: "Segoe UI", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      .marca { font-size: 2.6rem; font-weight: 700; letter-spacing: -0.02em; }
      .marca span { color: var(--acento); }
      .estado { font-size: 0.95rem; color: var(--gris); text-align: center; max-width: 26rem; line-height: 1.5; }
      .barra { width: 12rem; height: 3px; background: #2a3237; border-radius: 2px; overflow: hidden; }
      .barra i { display: block; height: 100%; width: 40%; background: var(--acento); border-radius: 2px; animation: correr 1.1s ease-in-out infinite; }
      @keyframes correr { 0% { transform: translateX(-100%); } 100% { transform: translateX(350%); } }
      .fallo { color: #ff8a7a; }
      button {
        margin-top: 0.5rem; border: 1.5px solid #2a3237; background: #1c2226;
        color: #fff; border-radius: 8px; padding: 0.6rem 1.4rem;
        font-size: 0.9rem; font-weight: 600; cursor: pointer;
      }
      button:hover { border-color: var(--acento); }
    </style>
  </head>
  <body>
    <div class="marca">MotRest<span>.</span></div>
    <div class="barra" id="barra"><i></i></div>
    <p class="estado" id="estado">Abriendo el local…</p>
    <button id="reintentar" hidden>Reintentar</button>

    <script src="arranque.js"></script>
  </body>
</html>
