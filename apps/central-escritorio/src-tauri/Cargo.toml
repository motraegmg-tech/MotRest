[package]
name = "motrae-central"
version = "1.3.4"
description = "MotRest Central — el panel de MOTRAE"
authors = ["MOTRAE"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "motrae_central_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Sin `tauri-plugin-shell`: esta app no arranca ningún proceso hijo. La caja
# levanta el Hub; Central no levanta nada, así que no se le da la capacidad de
# ejecutar programas. Es la app que guarda las llaves de firma de todos los
# restaurantes — cada permiso que no necesita es uno que no puede abusarse.
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

# Para hablar con la nube DESDE RUST y no desde la webview.
#
# Supabase rechaza una llave de servicio si la peticion trae User-Agent de
# navegador: contesta 401 «Forbidden use of secret API key in browser». Y hace
# bien -- una llave que se salta todas las politicas RLS no tiene nada que hacer
# en un contexto donde cualquier contenido web podria leerla.
#
# `rustls` en vez de la pila TLS del sistema: una dependencia menos que depende
# de como este configurada la maquina donde se compile.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio = { version = "1", features = ["rt-multi-thread"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
