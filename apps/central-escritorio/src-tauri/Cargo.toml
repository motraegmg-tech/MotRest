[package]
name = "motrae-central"
version = "1.1.0"
description = "MotRest Central — el panel de MOTRAE"
authors = ["MOTRAE"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "motrae_central_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

# Sin `tauri-plugin-shell`: esta app no arranca ningún proceso hijo. La caja
# levanta el Hub; Central no levanta nada, así que no se le da la capacidad de
# ejecutar programas. Es la app que guarda las llaves de firma de todos los
# restaurantes — cada permiso que no necesita es uno que no puede abusarse.
[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
