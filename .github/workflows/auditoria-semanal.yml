name: Auditoría semanal de dependencias de producción

on:
  schedule:
    # Cada lunes a las 04:17 UTC, fuera del horario operativo de los restaurantes.
    - cron: '17 4 * * 1'

# La auditoría consulta el lockfile y el registro; no necesita permisos de escritura en GitHub.
permissions:
  contents: read

# Sin esto, Corepack se para a pedir confirmación para descargar pnpm y el flujo
# se cuelga: en un runner no hay terminal donde contestar.
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"

jobs:
  auditar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener el código
        # actions/checkout@v4.3.1
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Configurar Node.js desde .nvmrc
        # actions/setup-node@v4.4.0
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version-file: .nvmrc

      - name: Auditar dependencias de producción
        run: corepack pnpm@9.15.0 audit --prod

      # Las dos apps de escritorio arrastran ~860 crates de Rust por debajo de
      # Tauri, y hasta agosto de 2026 no se habían contrastado nunca contra
      # RustSec. npm y cargo son dos árboles distintos: auditar uno no dice nada
      # del otro, y el que acaba en la caja del restaurante es el de cargo.
      - name: Instalar cargo-audit
        run: cargo install cargo-audit --locked

      - name: Auditar los crates de MotRest
        working-directory: apps/escritorio/src-tauri
        run: cargo audit

      - name: Auditar los crates de MotRest Central
        working-directory: apps/central-escritorio/src-tauri
        run: cargo audit
